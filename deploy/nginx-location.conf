# Include inside the quorum.aivylabs.xyz HTTPS server block.
# Keep this origin/path: existing recordings are stored in the browser here.
location = /demo-video/studio {
    return 301 /demo-video/studio/;
}
location ^~ /demo-video/studio/ {
    alias /var/www/take-studio/;
    index index.html;
    add_header Cache-Control "no-cache";
}
